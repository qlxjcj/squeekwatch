<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Card artwork for the Squeekchain Genesis submission.
    Designed for LED dot-matrix conversion: high contrast, few colors,
    large shapes, bold text. Rendered to PNG by scripts/render-card.mjs.
  -->
