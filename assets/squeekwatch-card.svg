  <rect x="0" y="0" width="1024" height="24" fill="#f5b942"/>
  <rect x="0" y="1000" width="1024" height="24" fill="#5b8cff"/>

  <!-- dot-matrix wheel -->
  <g transform="translate(512 380)">
    <circle r="270" fill="none" stroke="#2c2c3a" stroke-width="6"/>
    <g fill="#f5b942">
      <circle cx="0" cy="-250" r="17"/>
      <circle cx="87.5" cy="-234.2" r="17"/>
      <circle cx="163.9" cy="-188.6" r="17"/>
      <circle cx="221.3" cy="-117.6" r="17"/>
      <circle cx="250.2" cy="-31.7" r="17"/>
      <circle cx="242.5" cy="57.3" r="17"/>
      <circle cx="201.6" cy="137.4" r="17"/>
      <circle cx="135" cy="197.7" r="17"/>
      <circle cx="52.2" cy="232.1" r="17"/>
      <circle cx="-37" cy="237.3" r="17"/>
      <circle cx="-121.7" cy="211.5" r="17"/>
      <circle cx="-190.3" cy="157.4" r="17"/>
      <circle cx="-234.2" cy="83" r="17"/>
      <circle cx="-248.1" cy="-2.6" r="17"/>
      <circle cx="-228.8" cy="-88.8" r="17"/>
      <circle cx="-183.4" cy="-164.2" r="17"/>
      <circle cx="-116.7" cy="-217.3" r="17"/>
      <circle cx="-36.5" cy="-241.6" r="17"/>
    </g>
    <g fill="#f5b942" opacity="0.55">
      <circle cx="0" cy="-160" r="11"/>
      <circle cx="113.1" cy="-113.1" r="11"/>
      <circle cx="160" cy="0" r="11"/>
      <circle cx="113.1" cy="113.1" r="11"/>
      <circle cx="0" cy="160" r="11"/>
      <circle cx="-113.1" cy="113.1" r="11"/>
      <circle cx="-160" cy="0" r="11"/>
      <circle cx="-113.1" cy="-113.1" r="11"/>
    </g>
    <g stroke="#5b8cff" stroke-width="7">
      <line x1="0" y1="-250" x2="0" y2="250"/>
      <line x1="-216.5" y1="-125" x2="216.5" y2="125"/>
      <line x1="-216.5" y1="125" x2="216.5" y2="-125"/>
    </g>
    <circle r="52" fill="#5b8cff"/>
    <circle r="22" fill="#0d0d14"/>
  </g>

  <!-- wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="512" y="780" font-size="128" letter-spacing="10" fill="#eaeaf2">SQUEEK</text>
    <text x="512" y="900" font-size="64" letter-spacing="16" fill="#f5b942">WATCH</text>
    <text x="512" y="962" font-size="30" letter-spacing="6" fill="#9a9ab0">LIVE DASHBOARD · HAMSTER-POWERED CHAIN</text>
  </g>
</svg>
